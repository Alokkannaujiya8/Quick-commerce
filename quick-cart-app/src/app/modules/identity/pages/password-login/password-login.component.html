<app-auth-card-shell
  title="Email & Password Sign In"
  subtitle="Log in to your QuickCart account"
  backLink="/login"
  backAriaLabel="Back to Phone Login"
  [showLegalFooter]="false"
>
  <app-alert-banner [message]="errorMessage()" type="error" />

  <form (ngSubmit)="onSubmit()" class="auth-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        name="email"
        placeholder="name@example.com"
        [(ngModel)]="credentials.email"
        required
        autocomplete="email"
      />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        placeholder="••••••••"
        [(ngModel)]="credentials.password"
        required
        autocomplete="current-password"
      />
    </div>

    <app-ui-button
      type="submit"
      variant="primary"
      [loading]="isLoading()"
      loadingText="Signing In..."
    >
      Sign In
    </app-ui-button>
  </form>

  <div class="auth-footer">
    <div>Prefer phone OTP? <a routerLink="/login">Use mobile number</a></div>
    <div>Don't have an account? <a routerLink="/register">Create an account</a></div>
  </div>
</app-auth-card-shell>
